<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jenkins CI/CD Demo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #263b80 0%, transparent 35%),
                radial-gradient(circle at bottom right, #6d28d9 0%, transparent 35%),
                #080d1f;

            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 24px;

            padding: 60px 50px;

            text-align: center;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);
        }

        .badge {
            display: inline-block;

            padding: 8px 18px;

            border-radius: 30px;

            background: rgba(59, 130, 246, 0.15);

            border: 1px solid rgba(96, 165, 250, 0.4);

            color: #93c5fd;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.5px;

            margin-bottom: 25px;
        }

        h1 {
            font-size: 48px;

            font-weight: 800;

            line-height: 1.2;

            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa,
                #c084fc
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 24px;

            font-weight: 600;

            color: #e2e8f0;

            margin-bottom: 20px;
        }

        .description {
            font-size: 17px;

            color: #cbd5e1;

            line-height: 1.8;

            margin-bottom: 35px;
        }

        .pipeline {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 30px;

            margin-bottom: 35px;
        }

        .step {
            padding: 12px 18px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #e2e8f0;

            font-size: 14px;

            font-weight: 600;

            transition: all 0.3s ease;
        }

        .step:hover {
            transform: translateY(-4px);

            background: rgba(96, 165, 250, 0.15);

            border-color: rgba(96, 165, 250, 0.5);
        }

        .arrow {
            color: #818cf8;

            font-size: 20px;

            font-weight: bold;
        }

        .status {
            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding: 12px 22px;

            border-radius: 30px;

            background: rgba(34, 197, 94, 0.12);

            border: 1px solid rgba(34, 197, 94, 0.3);

            color: #86efac;

            font-size: 14px;

            font-weight: 600;
        }

        .dot {
            width: 9px;

            height: 9px;

            background: #22c55e;

            border-radius: 50%;

            box-shadow: 0 0 12px #22c55e;
        }

        footer {
            margin-top: 40px;

            color: #64748b;

            font-size: 13px;
        }

        @media (max-width: 650px) {

            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 34px;
            }

            h2 {
                font-size: 20px;
            }

            .description {
                font-size: 15px;
            }

            .arrow {
                display: none;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="badge">
            JENKINS CI/CD PROJECT
        </div>

        <h1>🚀 Jenkins CI/CD Demo</h1>

        <h2>Python Flask Application</h2>

        <p class="description">
            This application was deployed using Jenkins.
        </p>

        <div class="pipeline">

            <div class="step">Build</div>

            <div class="arrow">→</div>

            <div class="step">Test</div>

            <div class="arrow">→</div>

            <div class="step">Package</div>

            <div class="arrow">→</div>

            <div class="step">Approve</div>

            <div class="arrow">→</div>

            <div class="step">Deploy</div>

        </div>

        <div class="status">

            <span class="dot"></span>

            Deployment Successful

        </div>

        <footer>
            Powered by Jenkins • Python Flask • Gunicorn • AWS EC2
        </footer>

    </div>

</body>
</html>
